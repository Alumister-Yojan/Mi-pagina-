<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Proyectos | Alumister-Yojansel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Navegación Superior -->
    <nav class="bg-slate-950/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 py-4 px-4 sm:px-8 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-2 font-bold text-xl text-white hover:text-cyan-400 transition-colors">
            <i class="fa-solid fa-arrow-left text-cyan-400"></i> Volver al Inicio
        </a>
        <a href="https://wa.me/18099442504?text=Hola,%20quisiera%20cotizar%20un%20proyecto" target="_blank" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-4 py-2 rounded-full text-sm flex items-center gap-2 transition-all">
            <i class="fa-brands fa-whatsapp text-lg"></i> Cotizar
        </a>
    </nav>

    <!-- Encabezado de la Galería -->
    <header class="py-12 px-4 text-center max-w-4xl mx-auto">
        <span class="bg-cyan-500/20 text-cyan-300 border border-cyan-400/30 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Portafolio Multimedia</span>
        <h1 class="text-3xl sm:text-5xl font-extrabold mt-4 text-white">Nuestros Proyectos en Fotos y Video</h1>
        <p class="text-slate-400 text-base sm:text-lg mt-3">Calidad y precisión garantizadas para todos nuestros clientes en cada instalación de aluminio y vidrio.</p>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-16 flex-1 w-full">
        
        <!-- Cuadrícula Fotográfica (82 Proyectos con Filtros Interactivos) - PRIMERA SECCIÓN -->
        <section class="mb-16">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b border-slate-800 pb-4 gap-4">
                <h2 class="text-2xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-images text-cyan-400"></i> Galería Fotográfica (82 Proyectos)
                </h2>
                
                <!-- Botones de Filtro por Bloques de Proyectos -->
                <div class="flex flex-wrap gap-2 text-xs">
                    <button onclick="filtrarGaleria('todos')" id="btn-todos" class="px-3 py-1.5 rounded-lg bg-cyan-600 text-white font-semibold transition-colors">Todos (82)</button>
                    <button onclick="filtrarGaleria('bloque1')" id="btn-bloque1" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold transition-colors">Proyectos 1-30</button>
                    <button onclick="filtrarGaleria('bloque2')" id="btn-bloque2" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold transition-colors">Proyectos 31-60</button>
                    <button onclick="filtrarGaleria('bloque3')" id="btn-bloque3" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold transition-colors">Proyectos 61-82</button>
                </div>
            </div>

            <div id="galeria-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 sm:gap-6">
                
                <script>
                    const totalFotos = 82;
                    const container = document.getElementById('galeria-grid');
                    
                    for (let i = 1; i <= totalFotos; i++) {
                        // Asignar etiqueta de bloque para los filtros sin renombrar fotos
                        let grupo = 'bloque3';
                        if (i <= 30) grupo = 'bloque1';
                        else if (i <= 60) grupo = 'bloque2';

                        const card = document.createElement('div');
                        card.className = "proyecto-card bg-slate-800 rounded-xl overflow-hidden border border-slate-700 shadow-lg group hover:border-cyan-500/50 transition-all";
                        card.setAttribute('data-grupo', grupo);

                        card.innerHTML = `
                            <div class="relative overflow-hidden aspect-square bg-slate-950">
                                <img src="proyecto-${i}.jpeg" alt="Proyecto ${i} - Alumister-Yojansel" loading="lazy" 
                                     class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" 
                                     onerror="if(!this.dataset.retry){this.dataset.retry=true; this.src='proyecto-${i}.jpg';} else {this.parentElement.parentElement.style.display='none';}">
                            </div>
                            <div class="p-3 bg-slate-800/90 flex justify-between items-center text-xs text-slate-300">
                                <span class="font-semibold text-slate-200">Proyecto #${i}</span>
                                <a href="
